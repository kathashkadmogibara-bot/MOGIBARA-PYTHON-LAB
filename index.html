<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<meta name="theme-color" content="#17182c">
<title>MOGIBARA PYTHON LAB</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'><rect width='64' height='64' rx='16' fill='%236657e8'/><text x='32' y='47' font-size='40' font-weight='700' text-anchor='middle' fill='white' font-family='Arial'>M</text></svg>">
<link rel="stylesheet" href="style.css">
</head>
<body>

<!-- HEADER -->
<div class="appbar">
  <div class="brand">
    <div class="logo">M</div>
    <div style="min-width:0">
      <h1>MOGIBARA PYTHON LAB</h1>
      <div class="sub" id="title">new*</div>
    </div>
  </div>
  <a class="ib link" href="PASTE-LAW-BOOK-LINK-HERE" target="_blank" rel="noopener" title="Mogibara Python Law Book"><svg viewBox="0 0 24 24"><path d="M12 4C9.8 2.8 7 2 4 2v15c3 0 5.8.8 8 2 2.2-1.2 5-2 8-2V2c-3 0-5.8.8-8 2z"/></svg></a>
  <button class="ib" onclick="openFiles()" title="My files"><svg viewBox="0 0 24 24"><path d="M20 6h-8l-2-2H4a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V8a2 2 0 0 0-2-2zm0 12H4V6h5.2l2 2H20z"/></svg></button>
  <button class="ib" onclick="showExamples()" title="Examples"><svg viewBox="0 0 24 24"><path d="M9 21c0 .6.4 1 1 1h4c.6 0 1-.4 1-1v-1H9zm3-19a7 7 0 0 0-4 12.7V17c0 .6.4 1 1 1h6c.6 0 1-.4 1-1v-2.3A7 7 0 0 0 12 2zm2.9 11.1-.9.7V16h-4v-2.2l-.9-.7a5 5 0 1 1 5.8 0z"/></svg></button>
  <button class="ib" onclick="toggleMenu()" title="More"><svg viewBox="0 0 24 24"><path d="M12 8a2 2 0 1 0 0-4 2 2 0 0 0 0 4zm0 2a2 2 0 1 0 0 4 2 2 0 0 0 0-4zm0 6a2 2 0 1 0 0 4 2 2 0 0 0 0-4z"/></svg></button>
</div>
<div class="tabs" id="tabs"></div>

<div id="editorView">
  <div class="editor">
    <div id="numbers">1</div>
    <div class="codewrap">
      <pre id="hl" aria-hidden="true"></pre>
      <textarea id="code" spellcheck="false" autocapitalize="off" autocomplete="off" autocorrect="off" aria-label="Python code editor"></textarea>
    </div>
  </div>
  <button class="fab" onclick="runCode()" aria-label="Run"><svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>Run</button>
  <div class="keys" id="keys"></div>
</div>

<!-- MENU -->
<div class="scrim" id="scrim" onclick="closeMenu()"></div>
<div class="menu" id="menu">
  <div onclick="menuAct('new')"><svg viewBox="0 0 24 24"><path d="M12 2a10 10 0 1 0 0 20 10 10 0 0 0 0-20zm5 11h-4v4h-2v-4H7v-2h4V7h2v4h4z"/></svg>New</div>
  <div onclick="menuAct('files')"><svg viewBox="0 0 24 24"><path d="M20 6h-8l-2-2H4a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V8a2 2 0 0 0-2-2zm0 12H4V6h5.2l2 2H20z"/></svg>My files</div>
  <div onclick="menuAct('save')"><svg viewBox="0 0 24 24"><path d="M17 3H5a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V7zm-5 16a3 3 0 1 1 0-6 3 3 0 0 1 0 6zm3-10H5V5h10z"/></svg>Save</div>
  <div onclick="menuAct('saveas')"><svg viewBox="0 0 24 24"><path d="M20 6h-8l-2-2H4a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V8a2 2 0 0 0-2-2zm-2 9h-3v3h-2v-3H10v-2h3v-3h2v3h3z"/></svg>Save as</div>
  <div onclick="menuAct('copy')"><svg viewBox="0 0 24 24"><path d="M16 1H4a2 2 0 0 0-2 2v14h2V3h12zm3 4H8a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h11a2 2 0 0 0 2-2V7a2 2 0 0 0-2-2zm0 16H8V7h11z"/></svg>Copy code</div>
  <div onclick="menuAct('download')"><svg viewBox="0 0 24 24"><path d="M5 20h14v-2H5zM19 9h-4V3H9v6H5l7 7z"/></svg>Download .py</div>
  <div onclick="menuAct('close')"><svg viewBox="0 0 24 24"><path d="M19 6.4 17.6 5 12 10.6 6.4 5 5 6.4 10.6 12 5 17.6 6.4 19 12 13.4 17.6 19 19 17.6 13.4 12z"/></svg>Close</div>
</div>

<!-- FILES SCREEN -->
<div id="filesView">
  <div class="appbar">
    <button class="ib" onclick="closeFiles()" title="Back"><svg viewBox="0 0 24 24"><path d="M20 11H7.8l5.6-5.6L12 4l-8 8 8 8 1.4-1.4L7.8 13H20z"/></svg></button>
    <div class="title">My files</div>
  </div>
  <div class="fbar">
    <button class="pill" onclick="newFileDialog()">+ New file</button>
    <button class="pill alt" onclick="pasteDialog()">Paste code</button>
  </div>
  <div id="flist"></div>
</div>

<!-- dialogs -->
<div class="dlg" id="dlg" onclick="if(event.target===this)this.classList.remove('show')"><div class="box" id="dlgBox"></div></div>
<div class="dlg" id="modal"><div class="box" id="modalBox"></div></div>
<div id="toast"></div>

<!-- OUTPUT SCREEN -->
<div id="termView">
  <div class="appbar">
    <button class="ib" onclick="closeTerm()" title="Back"><svg viewBox="0 0 24 24"><path d="M20 11H7.8l5.6-5.6L12 4l-8 8 8 8 1.4-1.4L7.8 13H20z"/></svg></button>
    <div class="outtitle">Output</div>
    <div class="spacer"></div>
    <button class="tabbtn" onclick="closeTerm()">Editor</button>
    <button class="ib" onclick="runCode()" title="Run again"><svg viewBox="0 0 24 24"><path d="M12 5V1L7 6l5 5V7a6 6 0 1 1-6 6H4a8 8 0 1 0 8-8z"/></svg></button>
  </div>
  <div id="term"></div>
</div>

<script src="interpreter.js"></script>
<script src="script.js"></script>
</body>
</html>
